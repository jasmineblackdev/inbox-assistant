<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Triageo</title>
  <meta name="description" content="Triageo — a calm, private workspace for prioritizing email and approving every reply yourself. Nothing is ever sent automatically.">
  <meta name="theme-color" content="#0f1530">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta property="og:title" content="Triageo">
  <meta property="og:description" content="Your inbox, prioritized. Every reply approved by you.">
  <meta property="og:image" content="/brand/triageo-lockup-light.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Primary">
      <div class="sidebar-head">
        <a class="brand" href="#/overview" aria-label="Triageo overview">
          <img class="brand-full" src="brand/triageo-logo-dark.svg" alt="Triageo" width="132" height="34">
          <img class="brand-mark" src="brand/triageo-mark.svg" alt="Triageo" width="32" height="32">
        </a>
        <button type="button" class="icon-btn sidebar-close" data-action="close-nav" aria-label="Close navigation">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <nav id="nav" class="nav" aria-label="Views"></nav>
      <div class="sidebar-foot" id="sidebarFoot"></div>
    </aside>
    <div class="scrim" data-action="close-nav" aria-hidden="true"></div>
    <div class="main-col">
      <header class="topbar" id="topbar"></header>
      <main id="main" tabindex="-1">
        <div class="page" aria-busy="true" aria-label="Loading">
          <div class="skeleton sk-title"></div>
          <div class="kpis"><div class="skeleton sk-card"></div><div class="skeleton sk-card"></div><div class="skeleton sk-card"></div><div class="skeleton sk-card"></div></div>
          <div class="skeleton sk-panel"></div>
        </div>
      </main>
    </div>
  </div>
  <div id="dialogs"></div>
  <div class="toast-region" id="toasts" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">Triageo needs JavaScript to run. Your data never leaves this browser.</p></noscript>
</body>
</html>
